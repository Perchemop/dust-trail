name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Format, lint, tests, release build, and the personal-data/secret scan on
  # every push and PR. The scan is a hard gate: any real identifier or secret
  # fails the job (guide Part II §29).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Generate lockfile (first commit has no committed Cargo.lock yet)
        run: cargo generate-lockfile
      - name: Clippy (no warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Token discipline — no raw colours outside theme module
        run: |
          # guide II.30.6: no Color32::from_* outside src/theme/.
          if grep -rn --include='*.rs' -E 'Color32::from_(rgb|rgba|gray|black|white)' \
              apps/*/src crates/*/src | grep -v 'src/theme/'; then
            echo "::error::Raw colour constructor found outside src/theme/"
            exit 1
          fi
          echo "Token gate clean."
      - name: Tests (default features)
        run: cargo test --all --locked
      - name: Tests (gui feature)
        run: cargo test -p dust-trail --features gui --locked
      - name: Build release (default features)
        run: cargo build --release --locked
      - name: Build release (gui feature)
        run: cargo build --release --locked -p dust-trail --features gui
      - name: Personal data and secret scan
        run: |
          set -e
          echo "Scanning working tree for personal data and secrets..."
          # Patterns that indicate a real leak (obviously synthetic values are
          # allowed: dev@example.com, example.com, Jane Doe, +1 555 0100).
          # `/home/runner` (the CI runner account) is an allowed hit, and this
          # workflow file is excluded because it contains the scan pattern itself.
          if git grep -n -I -i -E '/home/[^/[:space:]]+' -- . \
              ':(exclude)*.lock' ':(exclude)Cargo.lock' ':(exclude).github/workflows/ci.yml' \
              | grep -v '/home/runner'; then
            echo "::error::Personal /home/ path found in tree"
            exit 1
          fi
          if git grep -n -I -E '[A-Za-z0-9._%+-]+@(gmail|outlook|hotmail|yahoo|proton)\.' -- .; then
            echo "::error::Personal email address found in tree"
            exit 1
          fi
          if git grep -n -I -E '(ghp_[A-Za-z0-9]{36,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z\\-_]{35,})' -- .; then
            echo "::error::Possible token/secret found in tree"
            exit 1
          fi
          echo "Scan clean."

  # Multi-OS release builds (mirrors release.yml targets).
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dust-trail-windows-x86_64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: dust-trail-macos-arm64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dust-trail-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # ----- Installer packaging per platform -----
      - name: Linux packages (.deb, .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg fakeroot file imagemagick
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          ARCH="$(dpkg --print-architecture)"
          DEBDIR="dist/dust-trail_0.1.0-1_${ARCH}"
          rm -rf "$DEBDIR"
          mkdir -p "$DEBDIR/DEBIAN" "$DEBDIR/usr/bin" \
                   "$DEBDIR/usr/share/applications" \
                   "$DEBDIR/usr/share/icons/hicolor/256x256/apps"
          printf 'Package: dust-trail\nVersion: 0.1.0-1\nSection: games\nPriority: optional\nArchitecture: %s\nMaintainer: Dust Trail Dev <dev@example.com>\nDescription: Original Western-themed ASCII adventure game (TUI + GUI)\n' "$ARCH" > "$DEBDIR/DEBIAN/control"
          cp "target/${TRIPLE}/release/dust-trail" "$DEBDIR/usr/bin/dust-trail"
          dpkg-deb --build "$DEBDIR" "dist/${{ matrix.asset }}.deb"
          APPDIR="dist/DustTrail.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/${TRIPLE}/release/dust-trail" "$APPDIR/usr/bin/dust-trail"
          printf '[Desktop Entry]\nType=Application\nName=Dust Trail\nExec=dust-trail\nTerminal=true\nCategories=Game;\n' > "$APPDIR/dust-trail.desktop"
          cp "$APPDIR/dust-trail.desktop" "$APPDIR/usr/share/applications/"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/dust-trail" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage" \
            || { echo "appimagetool not available for ${ARCH}, skipping AppImage"; rm -rf "$APPDIR"; exit 0; }
          chmod +x /tmp/appimagetool
          ARCH="$ARCH" /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "dist/${{ matrix.asset }}.AppImage" || { echo "AppImage build failed, skipping"; rm -f "dist/${{ matrix.asset }}.AppImage"; exit 0; }

      - name: Windows MSI installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo install cargo-wix --locked
          cargo wix init --force -p dust-trail
          cargo wix --nocapture -p dust-trail --target ${{ matrix.target }}
          mkdir -p dist
          cp target/wix/*.msi "dist/${{ matrix.asset }}.msi"

      - name: macOS DMG installer
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/Dust Trail.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/dust-trail" "$APP/Contents/MacOS/dust-trail"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleExecutable</key>\n    <string>dust-trail</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.dusttrail.app</string>\n    <key>CFBundleName</key>\n    <string>Dust Trail</string>\n    <key>CFBundleVersion</key>\n    <string>%s</string>\n    <key>CFBundleShortVersionString</key>\n    <string>%s</string>\n    <key>LSMinimumSystemVersion</key>\n    <string>11.0</string>\n</dict>\n</plist>\n' "$VERSION" "$VERSION" > "$APP/Contents/Info.plist"
          create-dmg \
            --volname "Dust Trail ${VERSION}" \
            --window-pos 200 120 --window-size 600 300 --icon-size 100 \
            --icon "Dust Trail.app" 175 120 \
            --hide-extension "Dust Trail.app" \
            --app-drop-link 425 120 \
            "dist/${{ matrix.asset }}.dmg" "$APP"

      - name: List built installers
        shell: bash
        run: ls -la dist/

      - name: Upload installer artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*.msi
          if-no-files-found: ignore
      - name: Upload installer artefacts (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: ignore

  # Supply-chain / packaging declaration check: dist-workspace.toml must stay
  # in sync with release.yml targets; a broken definition fails the PR.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate dist-workspace.toml is present and non-empty
        run: |
          test -s dist-workspace.toml || { echo "::error::dist-workspace.toml missing or empty"; exit 1; }
          grep -q '\[workspace\]' dist-workspace.toml || { echo "::error::dist-workspace.toml missing [workspace]"; exit 1; }
