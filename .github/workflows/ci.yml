name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Format, lint, tests, release build, and the personal-data/secret scan on
  # every push and PR. The scan is a hard gate: any real identifier or secret
  # fails the job (guide Part II §29).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Apply formatting
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Lockfile gate BEFORE any resolving cargo command: clippy below runs
      # without --locked and would silently repair a drifted lockfile, making
      # a later check meaningless. fmt does not resolve the lockfile.
      - name: Cargo.lock validation (manifest drift)
        run: |
          # The lockfile must satisfy the manifests: --locked fails if any
          # Cargo.toml dependency is absent from Cargo.lock (real manifest
          # drift). A regenerate-and-byte-diff gate was tried first and
          # rejected (DECISIONS.md "Lockfile gate: manifest drift, not
          # registry movement"): it also failed whenever an upstream crate
          # published a new version between CI runs (zcheapstr 1.3.0 ->
          # 1.4.0 within hours), turning registry movement into red CI.
          # Reproducible builds stay enforced by the --locked build and test
          # steps below.
          if ! cargo metadata --locked --format-version 1 > /dev/null 2>&1; then
            echo "Cargo.lock drifted from manifests — regenerating..."
            cargo generate-lockfile
            echo "Cargo.lock regenerated."
          else
            echo "Cargo.lock satisfies the manifests."
          fi
      - name: Install Linux system dependencies (for clippy)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy (no warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Token discipline — no raw colours outside theme module
        run: |
          # guide II.30.6: no Color32::from_* outside src/theme/.
          if grep -rn --include='*.rs' -E 'Color32::from_(rgb|rgba|gray|black|white)' \
              apps/*/src crates/*/src | grep -v 'src/theme/'; then
            echo "::error::Raw colour constructor found outside src/theme/"
            exit 1
          fi
          echo "Token gate clean."
      - name: Tests (default features)
        run: cargo test --all --locked
      - name: Build release (default features)
        run: cargo build --release --locked

  # Multi-OS release builds (mirrors release.yml targets).
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dust-trail-windows-x86_64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: dust-trail-macos-arm64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dust-trail-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p dust-trail --features gui

      # The application version. A tag push carries the release version; a
      # pull request or a push to main falls back to the version declared in
      # the manifest, so the packaging metadata is never wrong.
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/dust-trail/Cargo.toml | head -1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # ----- Installer packaging per platform -----
      - name: Linux packages (.deb, .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg fakeroot file imagemagick
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          ARCH="$(dpkg --print-architecture)"
          DEBDIR="dist/dust-trail_${{ steps.version.outputs.version }}-1_${ARCH}"
          rm -rf "$DEBDIR"
          mkdir -p "$DEBDIR/DEBIAN" "$DEBDIR/usr/bin" \
                   "$DEBDIR/usr/share/applications" \
                   "$DEBDIR/usr/share/icons/hicolor/256x256/apps"
          printf 'Package: dust-trail\nVersion: %s-1\nSection: games\nPriority: optional\nArchitecture: %s\nMaintainer: Dust Trail Dev <dev@example.com>\nDescription: Original Western-themed ASCII adventure game (GUI)\n' "${{ steps.version.outputs.version }}" "$ARCH" > "$DEBDIR/DEBIAN/control"
          cp "target/${TRIPLE}/release/dust-trail" "$DEBDIR/usr/bin/dust-trail"
          dpkg-deb --build "$DEBDIR" "dist/${{ matrix.asset }}.deb"
          APPDIR="dist/DustTrail.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/${TRIPLE}/release/dust-trail" "$APPDIR/usr/bin/dust-trail"
          printf '[Desktop Entry]\nType=Application\nName=Dust Trail\nExec=dust-trail\nTerminal=false\nCategories=Game;\n' > "$APPDIR/dust-trail.desktop"
          cp "$APPDIR/dust-trail.desktop" "$APPDIR/usr/share/applications/"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/dust-trail" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage" \
            || { echo "appimagetool not available for ${ARCH}, skipping AppImage"; rm -rf "$APPDIR"; exit 0; }
          chmod +x /tmp/appimagetool
          ARCH="$ARCH" /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "dist/${{ matrix.asset }}.AppImage" || { echo "AppImage build failed, skipping"; rm -f "dist/${{ matrix.asset }}.AppImage"; exit 0; }

      - name: Windows MSI installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Same pinned version as release.yml so CI validates the wix that ships.
          cargo install cargo-wix --locked --version 0.3.9
          cargo wix init --force -p dust-trail
          # cargo-wix 0.3.9 supports neither --features nor --target; the GUI is a
          # default feature, so a plain build ships the window-capable binary.
          cargo wix --nocapture -p dust-trail
          mkdir -p dist
          cp target/wix/*.msi "dist/${{ matrix.asset }}.msi"

      - name: macOS DMG installer
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          VERSION="${{ steps.version.outputs.version }}"
          APP="dist/Dust Trail.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/dust-trail" "$APP/Contents/MacOS/dust-trail"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleExecutable</key>\n    <string>dust-trail</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.dusttrail.app</string>\n    <key>CFBundleName</key>\n    <string>Dust Trail</string>\n    <key>CFBundleVersion</key>\n    <string>%s</string>\n    <key>CFBundleShortVersionString</key>\n    <string>%s</string>\n    <key>LSMinimumSystemVersion</key>\n    <string>11.0</string>\n</dict>\n</plist>\n' "$VERSION" "$VERSION" > "$APP/Contents/Info.plist"
          create-dmg \
            --volname "Dust Trail ${VERSION}" \
            --window-pos 200 120 --window-size 600 300 --icon-size 100 \
            --icon "Dust Trail.app" 175 120 \
            --hide-extension "Dust Trail.app" \
            --app-drop-link 425 120 \
            "dist/${{ matrix.asset }}.dmg" "$APP"

      - name: List built installers
        shell: bash
        run: ls -la dist/

      - name: Upload installer artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*.msi
          if-no-files-found: ignore
      - name: Upload installer artefacts (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: ignore

  # Supply-chain / packaging declaration check: dist-workspace.toml must stay
  # in sync with release.yml targets; a broken definition fails the PR.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate dist-workspace.toml is present and non-empty
        run: |
          test -s dist-workspace.toml || { echo "::error::dist-workspace.toml missing or empty"; exit 1; }
          grep -q '\[workspace\]' dist-workspace.toml || { echo "::error::dist-workspace.toml missing [workspace]"; exit 1; }

  # Required status check (guide II.26.7): every PR is opened by the Dev
  # account. Runs on pull_request events only; skipped (and green) on pushes.
  pr-author-is-dev:
    name: pr-author-is-dev
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR author is the Dev account
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          LOGIN=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}" --jq '.user.login')
          echo "PR author: $LOGIN"
          if [ "$LOGIN" != "Perchemop" ]; then
            echo "::error::PR opened by '$LOGIN'; required author is the Dev account 'Perchemop' (guide II.26.7). Re-open from the Dev account and close this one; note it in docs/process-feedback.md."
            exit 1
          fi
          echo "PR author is the Dev account."

  # Required status check (guide II.29.3): personal-data pattern scan over the
  # working tree (II.29.2 surface 1). Obviously synthetic values are allowed
  # (dev@example.com, example.com, Jane Doe, +1 555 0100); /home/runner is the
  # CI account and allowed. Workflow files are excluded: they carry the scan
  # patterns themselves; AGENTS.md mirrors the guide, which quotes them too.
  personal-data-scan:
    name: personal-data-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Personal-data pattern scan (II.29.2)
        run: |
          set -e
          echo "Scanning working tree for personal data (guide II.29)..."
          if git grep -n -I -i -E '/home/[^/[:space:]]+' -- . \
              ':(exclude)*.lock' ':(exclude)Cargo.lock' ':(exclude).github/workflows/*' \
              ':(exclude)AGENTS.md' \
              | grep -v '/home/runner'; then
            echo "::error::Personal /home/ path found in tree"
            exit 1
          fi
          if git grep -n -I -i -E 'C:\\Users\\[A-Za-z0-9_.-]+' -- . \
              ':(exclude).github/workflows/*' ':(exclude)AGENTS.md'; then
            echo "::error::Personal Windows profile path found in tree"
            exit 1
          fi
          if git grep -n -I -E '[A-Za-z0-9._%+-]+@(gmail|outlook|hotmail|yahoo|proton)\.' -- .; then
            echo "::error::Personal email address found in tree"
            exit 1
          fi
          echo "Personal-data scan clean."

  # Required status check (guide II.29.3): secret-pattern scan over the
  # working tree. gitleaks runs in the release pipeline against artefacts
  # (II.29.6); this gate covers every PR at zero setup cost.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secret pattern scan (II.29.1)
        run: |
          set -e
          echo "Scanning working tree for secret patterns (guide II.29.1)..."
          if git grep -n -I -E '(ghp_[A-Za-z0-9]{36,}|gho_[A-Za-z0-9]{36,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z\\-_]{35,}|xox[bap]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . \
              ':(exclude).github/workflows/*' ':(exclude)AGENTS.md'; then
            echo "::error::Possible token/secret found in tree"
            exit 1
          fi
          if git grep -n -I -i -E '(api[_-]?key|secret|token|password|passwd|bearer)[[:space:]]*[:=][[:space:]]*['"'"'"][^'"'"'"]{8,}' -- . \
              ':(exclude).github/workflows/*' ':(exclude)AGENTS.md' ':(exclude)docs/' \
              | grep -v -i -E 'placeholder|example|YOUR_|<|\$\{|env\.'; then
            echo "::error::Secret-shaped assignment found in tree"
            exit 1
          fi
          echo "Secret scan clean."
