name: Release

# Builds and publishes installable release artefacts on version tags and on
# manual dispatch. Every release MUST attach platform installers (not a zip of
# source): Windows .msi, macOS .dmg, Linux .deb + .rpm + .AppImage, plus
# SHA256SUMS.txt. See AGENTS.md (installable-builds directive).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tokens:
        description: "Tokens consumed by this release (for docs/tokens.json)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dust-trail-windows-x86_64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: dust-trail-macos-arm64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dust-trail-linux-x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dust-trail-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config \
            libxcb1-dev libxkbcommon-dev libwayland-dev \
            fakeroot dpkg rpm file imagemagick
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Build release (TUI + GUI)
        run: cargo build --release --features gui --target ${{ matrix.target }}

      # ----- Windows: .msi installer via cargo-wix -----
      - name: Windows MSI installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo install cargo-wix --locked
          cargo wix init --force
          cargo wix --nocapture --target ${{ matrix.target }}
          mkdir -p dist
          cp target/wix/*.msi "dist/${{ matrix.asset }}.msi"

      # ----- macOS: .dmg installer via create-dmg -----
      - name: macOS DMG installer
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/Dust Trail.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/dust-trail" "$APP/Contents/MacOS/dust-trail"
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          create-dmg \
            --volname "Dust Trail ${VERSION}" \
            --window-pos 200 120 --window-size 600 300 --icon-size 100 \
            --icon "Dust Trail.app" 175 120 \
            --hide-extension "Dust Trail.app" \
            --app-drop-link 425 120 \
            "dist/${{ matrix.asset }}.dmg" "$APP"

      # ----- Linux: .deb, .rpm, .AppImage -----
      - name: Linux packages (.deb, .rpm, .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
          cargo deb --target ${{ matrix.target }} --no-build --output dist/ --deb-revision 1
          cargo generate-rpm --target ${{ matrix.target }} --output dist/
          ARCH="$(uname -m)"
          APPDIR="dist/DustTrail.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/${{ matrix.target }}/release/dust-trail" "$APPDIR/usr/bin/dust-trail"
          cp packaging/linux/dust-trail.desktop "$APPDIR/dust-trail.desktop"
          cp packaging/linux/dust-trail.desktop "$APPDIR/usr/share/applications/"
          cp packaging/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          convert -size 256x256 xc:'#5a3b1e' \
            -fill '#e6c86e' -draw 'polygon 128,32 224,128 128,224 32,128' \
            "$APPDIR/dust-trail.png"
          cp "$APPDIR/dust-trail.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/"
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x /tmp/appimagetool
          ARCH="$ARCH" /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "dist/${{ matrix.asset }}.AppImage"

      - name: List built installers
        shell: bash
        run: ls -la dist/

      - name: Upload installer artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*.msi
          if-no-files-found: ignore
      - name: Upload installer artefacts (non-Windows)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  # Create a draft GitHub Release with installers + checksums; a maintainer publishes it.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artefacts
        uses: actions/download-artifact@6656a9999d3c29d5eab6a038c14c2fa98a963cf6 # v4.1.2
        with:
          path: dist/
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(awk "/## \[${TAG}\]/,/## \[/" CHANGELOG.md | head -60)
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Dust Trail $TAG" \
            --notes "${NOTES:-See CHANGELOG.md}" \
            --draft \
            "${ASSETS[@]}"
