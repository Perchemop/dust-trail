name: Release

# Builds and publishes release artefacts on version tags and on manual dispatch.
# Every release must provide installable build artefacts for every platform:
# - Windows: .msi installer
# - macOS: .dmg (AppImage not supported on macOS)
# - Linux: .AppImage (portable) + .deb/.rpm (native packages)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tokens:
        description: "Tokens consumed by this release (for docs/tokens.json)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: produces .msi installer via cargo-wix
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dust-trail-windows-x86_64
            installer: wix
          # macOS: produces .dmg via create-dmg
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: dust-trail-macos-arm64
            installer: dmg
          # Linux x86_64: produces .AppImage, .deb, .rpm
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dust-trail-linux-x86_64
            installer: appimage
          # Linux ARM64: produces .AppImage
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dust-trail-linux-arm64
            installer: appimage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf fuse libfuse2 \
            rpm dpkg fakeroot
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset --version 3.11.2 --no-progress
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Windows MSI installer
        if: runner.os == 'Windows' && matrix.installer == 'wix'
        run: |
          cargo install cargo-wix --locked
          cargo wix --release --target ${{ matrix.target }}
          mkdir -p dist
          # cargo-wix outputs to target/wix/*.msi
          cp target/wix/*.msi dist/${{ matrix.asset }}.msi
          echo "asset=dist/${{ matrix.asset }}.msi" >> "$GITHUB_OUTPUT"
      - name: Package macOS DMG installer
        if: runner.os == 'macOS' && matrix.installer == 'dmg'
        run: |
          mkdir -p dist
          # Create app bundle
          mkdir -p "dist/${{ matrix.asset }}.app/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/dust-trail" "dist/${{ matrix.asset }}.app/Contents/MacOS/dust-trail"
          cat > "dist/${{ matrix.asset }}.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>dust-trail</string>
              <key>CFBundleIdentifier</key>
              <string>com.dusttrail.app</string>
              <key>CFBundleName</key>
              <string>Dust Trail</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
          </dict>
          </plist>
          EOF
          # Create DMG
          create-dmg \
            --volname "Dust Trail ${GITHUB_REF_NAME#v}" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "dist/${{ matrix.asset }}.app" 175 120 \
            --hide-extension "dist/${{ matrix.asset }}.app" \
            --app-drop-link 425 120 \
            "dist/${{ matrix.asset }}.dmg" \
            "dist/${{ matrix.asset }}.app"
          echo "asset=dist/${{ matrix.asset }}.dmg" >> "$GITHUB_OUTPUT"
      - name: Package Linux AppImage
        if: runner.os == 'Linux' && matrix.installer == 'appimage'
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
          cargo install linuxdeploy --locked
          cargo install linuxdeploy-plugin-appimage --locked
          # Build AppImage using linuxdeploy
          mkdir -p dist
          APPDIR="dist/${{ matrix.asset }}.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp "target/${{ matrix.target }}/release/dust-trail" "$APPDIR/usr/bin/dust-trail"
          # Create minimal .desktop file
          cat > "$APPDIR/dust-trail.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dust Trail
          Exec=dust-trail
          Icon=dust-trail
          Categories=Game;
          Terminal=true
          EOF
          # Create AppImage
          export VERSION="${GITHUB_REF_NAME#v}"
          linuxdeploy --appdir "$APPDIR" --output appimage
          mv Dust_Trail-*.AppImage "dist/${{ matrix.asset }}.AppImage"
          echo "asset=dist/${{ matrix.asset }}.AppImage" >> "$GITHUB_OUTPUT"
          # Also create .deb and .rpm
          cargo deb --target ${{ matrix.target }} --no-build --deb-version "$VERSION" --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/
      - name: Upload artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/

  # Create a draft GitHub Release with checksums; a maintainer publishes it.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artefacts
        uses: actions/download-artifact@6656a9999d3c29d5eab6a038c14c2fa98a963cf6 # v4.1.2
        with:
          path: dist/
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat CHANGELOG.md | sed -n "/## \[$TAG\]/,/## \[/p" | head -60)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Dust Trail $TAG" \
            --notes "$NOTES" \
            --draft \
            dist/* SHA256SUMS.txt || true