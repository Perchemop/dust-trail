name: Release

# Builds and publishes installable release artefacts on version tags and on
# manual dispatch. A release cannot publish unless ALL of the following exist:
#   - the four exact installers: dust-trail-windows-x86_64.msi,
#     dust-trail-macos-arm64.dmg, dust-trail-linux-x86_64.deb,
#     dust-trail-linux-arm64.deb
#   - SHA256SUMS.txt with checksums for the four installers only
#   - SHA256SUMS.txt.asc: GPG detached (armored) signature over SHA256SUMS.txt
#   - dust-trail-sbom.cdx.json: CycloneDX SBOM (cargo-cyclonedx 0.5.10)
# plus a personal-data/secret scan of every asset before publication.
# Signing secrets are required: missing GPG_PRIVATE_KEY or GPG_PASSPHRASE
# fails the release instead of publishing unsigned.
# See docs/update-signing.md and AGENTS.md (installable-builds directive).
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tokens:
        description: "Tokens consumed by this release (for docs/tokens.md)"
        required: false
        default: "0"
      tag_name:
        description: "Tag to release (for manual dispatch; tag push uses GITHUB_REF_NAME)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Exact installer asset names required on every release — the single source
  # of truth for the exact-name verification, SHA256SUMS.txt and the asset
  # upload list. Keep in sync with the build matrix `asset` values below.
  REQUIRED_INSTALLERS: |
    dust-trail-windows-x86_64.msi
    dust-trail-macos-arm64.dmg
    dust-trail-linux-x86_64.deb
    dust-trail-linux-arm64.deb
  # Explicit SBOM output filename (cargo-cyclonedx --override-filename
  # appends ".json", producing dust-trail-sbom.cdx.json).
  SBOM_ASSET: dust-trail-sbom.cdx.json

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dust-trail-windows-x86_64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: dust-trail-macos-arm64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dust-trail-linux-x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dust-trail-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config \
            libxcb1-dev libxkbcommon-dev libwayland-dev \
            dpkg fakeroot file imagemagick
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        # brew has no practical version pin for create-dmg; the formula is
        # tracked by Dependabot-free manual review (see docs/dev.md).
        run: brew install create-dmg
      - name: Build release (TUI + GUI)
        run: cargo build --release --locked --features gui --target ${{ matrix.target }}

      # ----- Windows: .msi installer via cargo-wix (version pinned) -----
      - name: Windows MSI installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo install cargo-wix --locked --version 0.3.9
          cargo wix init --force -p dust-trail
          # cargo-wix 0.3.9 supports neither --features nor --target; the GUI is a
          # default feature (DECISIONS.md "GUI is a default feature"), so a plain
          # build ships the window-capable binary.
          cargo wix --nocapture -p dust-trail
          mkdir -p dist
          cp target/wix/*.msi "dist/${{ matrix.asset }}.msi"

      # ----- macOS: .dmg installer via create-dmg -----
      - name: macOS DMG installer
        if: runner.os == 'macOS'
        run: |
          # Prefer an explicit tag input (manual dispatch); otherwise use the
          # pushed tag. Strip any leading "v".
          if [ -n "${{ inputs.tag_name }}" ]; then
            VERSION="${{ inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          APP="dist/Dust Trail.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/dust-trail" "$APP/Contents/MacOS/dust-trail"
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          create-dmg \
            --volname "Dust Trail ${VERSION}" \
            --window-pos 200 120 --window-size 600 300 --icon-size 100 \
            --icon "Dust Trail.app" 175 120 \
            --hide-extension "Dust Trail.app" \
            --app-drop-link 425 120 \
            "dist/${{ matrix.asset }}.dmg" "$APP"

      # ----- Linux: .deb via dpkg-deb -----
      - name: Linux packages (.deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          ARCH="$(dpkg --print-architecture)"
          # Prefer an explicit tag input (manual dispatch); otherwise use the
          # pushed tag. Strip any leading "v".
          if [ -n "${{ inputs.tag_name }}" ]; then
            VERSION="${{ inputs.tag_name }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          # .deb via dpkg-deb (manual, reliable).
          DEBDIR="dist/dust-trail_${VERSION}-1_${ARCH}"
          rm -rf "$DEBDIR"
          mkdir -p "$DEBDIR/DEBIAN" "$DEBDIR/usr/bin" \
                   "$DEBDIR/usr/share/applications" \
                   "$DEBDIR/usr/share/icons/hicolor/256x256/apps"
          printf 'Package: dust-trail\nVersion: %s-1\nSection: games\nPriority: optional\nArchitecture: __ARCH__\nMaintainer: Dust Trail Dev <dev@example.com>\nDescription: Original Western-themed ASCII adventure game (TUI + GUI)\n' "$VERSION" > "$DEBDIR/DEBIAN/control"
          sed -i "s/__ARCH__/${ARCH}/g" "$DEBDIR/DEBIAN/control"
          cp "target/${TRIPLE}/release/dust-trail" "$DEBDIR/usr/bin/dust-trail"
          cp packaging/linux/dust-trail.desktop "$DEBDIR/usr/share/applications/"
          convert -size 256x256 xc:'#5a3b1e' \
            -fill '#e6c86e' -draw 'polygon 128,32 224,128 128,224 32,128' \
            "$DEBDIR/usr/share/icons/hicolor/256x256/apps/dust-trail.png"
          dpkg-deb --build "$DEBDIR" "dist/${{ matrix.asset }}.deb"

      - name: List built installers
        shell: bash
        run: ls -la dist/

      # Each platform uploads its own installer; a missing installer fails the
      # build job here instead of surfacing late in the release job.
      - name: Upload installer artefact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*.msi
          if-no-files-found: error
      - name: Upload installer artefact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*.dmg
          if-no-files-found: error
      - name: Upload installer artefact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*.deb
          if-no-files-found: error

  # Publish a real (non-draft) GitHub Release with the four exact installers,
  # SHA256SUMS.txt (installers only), its GPG detached signature and a
  # CycloneDX SBOM — after an exact-name gate and an asset scan.
  # Idempotent: re-running updates an existing release instead of failing.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain for the pinned SBOM generator (no project compilation here).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Download all artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Verify exact installer set (all four, exact names)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then
              echo "ERROR: required installer '$f' was not built — the release cannot publish without it." >&2
              status=1
            fi
          done <<< "$REQUIRED_INSTALLERS"
          # Refuse any installer-named file that is not one of the four exact
          # names, so a misnamed artefact can never reach the release page.
          for f in *.msi *.dmg *.deb; do
            [ -e "$f" ] || continue
            if ! printf '%s\n' "$REQUIRED_INSTALLERS" | grep -qx -- "$f"; then
              echo "ERROR: unexpected installer artefact '$f' — expected exactly the four names in REQUIRED_INSTALLERS." >&2
              status=1
            fi
          done
          exit "$status"

      - name: Generate SHA256SUMS.txt (installers only)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Checksum exactly the four required installers, sorted (C locale for
          # determinism), bare filenames (no "./" prefix) so
          # `sha256sum -c SHA256SUMS.txt` works from the directory containing
          # both this file and the installers. Nothing else is checksummed.
          : > SHA256SUMS.txt
          printf '%s\n' "$REQUIRED_INSTALLERS" | LC_ALL=C sort | \
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              sha256sum "$f" >> SHA256SUMS.txt
            done
          cat SHA256SUMS.txt

      - name: Sign SHA256SUMS.txt (GPG detached, armored)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Fail closed with the concrete reason when signing material is
          # absent (guide §5.5 item 11) — never publish unsigned.
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "ERROR: secret GPG_PRIVATE_KEY is not set — refusing to publish an unsigned release." >&2
            echo "Provision an ASCII-armored private signing key; see docs/update-signing.md." >&2
            exit 1
          fi
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "ERROR: secret GPG_PASSPHRASE is not set — refusing to publish an unsigned release." >&2
            echo "Provision the passphrase protecting the signing key; see docs/update-signing.md." >&2
            exit 1
          fi
          # Import into a throwaway GNUPGHOME outside the workspace so key
          # material never lands in artefacts, the repository, or a shared
          # agent state; it is destroyed when this step ends.
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          # Public identifier only — safe to print.
          KEYFP="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          if [ -z "$KEYFP" ]; then
            echo "ERROR: no signing key found after import; check GPG_PRIVATE_KEY armour (see docs/update-signing.md)." >&2
            exit 1
          fi
          if [ -n "${GPG_KEY_FINGERPRINT}" ]; then
            EXPECTED="$(printf '%s' "$GPG_KEY_FINGERPRINT" | tr -d ' ')"
            if [ "${KEYFP^^}" != "${EXPECTED^^}" ]; then
              echo "ERROR: imported signing key fingerprint $KEYFP does not match the pinned GPG_KEY_FINGERPRINT — refusing to sign." >&2
              exit 1
            fi
          else
            echo "NOTE: GPG_KEY_FINGERPRINT is not pinned yet; signing with imported key $KEYFP. Pin it before the next release (docs/update-signing.md)."
          fi
          # Passphrase arrives on fd 0 — never a command-line argument, never
          # echoed. GitHub's automatic secret masking is the second layer.
          printf '%s' "$GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --local-user "$KEYFP" \
                --passphrase-fd 0 --armor --detach-sign \
                --output SHA256SUMS.txt.asc SHA256SUMS.txt
          # Verify with the freshly imported public key before publishing.
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          echo "Signed SHA256SUMS.txt -> SHA256SUMS.txt.asc (key $KEYFP) and verified."

      - name: Generate CycloneDX SBOM (cargo-cyclonedx 0.5.10)
        shell: bash
        run: |
          set -euo pipefail
          # Tool version pinned; the subcommand takes no --locked flag in
          # 0.5.10, the dependency graph comes from the committed Cargo.lock.
          cargo install cargo-cyclonedx --locked --version 0.5.10
          cargo cyclonedx \
            --all-features \
            --target all \
            --format json \
            --override-filename dust-trail-sbom.cdx
          # cargo-cyclonedx writes one SBOM per workspace member next to each
          # Cargo.toml. The release ships the application SBOM, which embeds
          # the crash-report and update-check crates as components.
          if [ ! -f apps/dust-trail/dust-trail-sbom.cdx.json ]; then
            echo "ERROR: expected SBOM apps/dust-trail/dust-trail-sbom.cdx.json was not generated." >&2
            exit 1
          fi
          mv apps/dust-trail/dust-trail-sbom.cdx.json "dist/${SBOM_ASSET}"
          jq -e . "dist/${SBOM_ASSET}" > /dev/null
          echo "SBOM generated: dist/${SBOM_ASSET}"

      - name: Scan release assets (personal paths & secrets)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          status=0
          # Report file names only — never print matched content, which could
          # itself be the secret or personal value (guide II.29.2).
          scan_pattern() {
            local label="$1" pattern="$2" f hits
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              hits="$(grep -iaoE -- "$pattern" "$f" 2>/dev/null || true)"
              # /home/runner is the CI's own home directory and allowed
              # (guide II.29.2: only CI identities and synthetic values pass).
              if [ "$label" = "personal /home path" ]; then
                hits="$(printf '%s\n' "$hits" | grep -v '^/home/runner$' || true)"
              fi
              if [ -n "$hits" ]; then
                echo "ERROR: release-asset scan found a $label pattern in artefact: $f (content withheld)" >&2
                status=1
              fi
            done < <(find . -type f | sort)
          }
          scan_pattern "personal /home path" '/home/[A-Za-z0-9_-]+'
          scan_pattern "personal Windows profile path" 'C:\\Users\\[A-Za-z0-9_.-]+'
          Q='[\"'\'']'
          scan_pattern "secret assignment" \
            "(api[_-]?key|secret|token|password|passwd|bearer)[[:space:]]*[:=][[:space:]]*${Q}[^\"']+"
          exit "$status"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          TAG="${RELEASE_TAG}"
          # Extract the CHANGELOG section for this tag. Headings look like
          # "## v1.5.0 - 2026-11-18" (no brackets).
          NOTES=$(awk -v tag="$TAG" '
            /^## / { if ($0 ~ "^## " tag " ") { found=1; print; next } else { exit } }
            found { print }
          ' CHANGELOG.md | head -60)
          if [ -z "${NOTES}" ]; then
            NOTES="See CHANGELOG.md for the full release notes."
          fi
          # Append token-usage metrics if a row exists for this version.
          # The table cells are space-padded, so match the version column
          # loosely rather than requiring exactly one space before the pipe.
          TOKEN_LINE=$(grep "^| ${TAG}[[:space:]]*|" docs/tokens.md || true)
          if [ -n "${TOKEN_LINE}" ]; then
            NOTES="${NOTES}

## Token usage metrics
${TOKEN_LINE}"
          fi
          # Plain-language per-platform install instructions.
          NOTES="${NOTES}

## How to install

- **Windows:** Download the `.msi` installer and double-click it to run the setup wizard.
- **macOS:** Download the `.dmg` file, open it, and drag Dust Trail into your Applications folder.
- **Linux:** Download the `.deb` file and double-click it in your package installer to install.

## Integrity and supply-chain artefacts

All four installers are listed with their SHA-256 checksums in \`SHA256SUMS.txt\`; verify with \`sha256sum -c SHA256SUMS.txt\` after downloading the installers into the same directory. \`SHA256SUMS.txt.asc\` is the GPG detached signature over that file — the signing public key, its pinned fingerprint and the verification steps are documented in \`docs/update-signing.md\`. \`dust-trail-sbom.cdx.json\` is a CycloneDX software bill of materials (JSON) for this release."

          ASSETS=(
            dist/dust-trail-windows-x86_64.msi
            dist/dust-trail-macos-arm64.dmg
            dist/dust-trail-linux-x86_64.deb
            dist/dust-trail-linux-arm64.deb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.asc
            "dist/${SBOM_ASSET}"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (possibly a draft from a previous run):
            # upload/clobber assets, edit title+notes, and make sure it is
            # published (not a draft).
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Dust Trail $TAG" \
              --notes "${NOTES}" \
              --draft=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Dust Trail $TAG" \
              --notes "${NOTES}" \
              "${ASSETS[@]}"
          fi
