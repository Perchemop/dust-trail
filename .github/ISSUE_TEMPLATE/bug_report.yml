name: Bug Report
description: Report a bug in Dust Trail
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Start Dust Trail (TUI or GUI)
        2. Move north ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Crash report / logs
      description: Paste any parked crash report (never real names or paths).
