[package]
name = "dust-trail"
version = "1.5.1"
edition = "2021"
rust-version = "1.82"
description = "Dust Trail — original Western-themed 3D isometric ASCII adventure game (GUI)."
license = "MIT OR Apache-2.0"
authors = ["Dust Trail Dev <dev@example.com>"]
readme = "../../README.md"
default-run = "dust-trail"
repository = "https://github.com/Perchemop/dust-trail"
keywords = ["game", "ascii", "egui", "western", "adventure"]
categories = ["games"]

[dependencies]
# Shared suite crates (guide §7): crash reporting and update checks.
crash-report = { path = "../../crates/crash-report", version = "0.2.1" }
update-check = { path = "../../crates/update-check", version = "0.2.0" }

directories = "6"
rand = "0.10.4"
rodio = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# GUI frontend (egui/eframe 0.37, matching the suite).
[dependencies.eframe]
version = "0.37"
optional = true

[dependencies.egui]
version = "0.37"
optional = true

[features]
# The GUI is the only frontend (the terminal interface was removed in
# v2.0.0). It is a default feature so that every build of the package —
# including the ones produced by the release pipeline and by `cargo wix` —
# ships a window-capable binary.
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "sound"]
sound = ["dep:rodio"]

# --- Linux packaging metadata (cargo-deb / cargo-generate-rpm) ---
[package.metadata.deb]
maintainer = "Dust Trail Dev <dev@example.com>"
copyright = "2026 Dust Trail Dev"
license-file = ["../../LICENSE", "0"]
extended-description = """Dust Trail is a free, original Western-themed adventure game
rendered entirely in ASCII. Playable as a desktop window (GUI). Fully offline; no commercial trademarks or assets."""
section = "games"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/dust-trail", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/dust-trail/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/dust-trail", dest = "/usr/bin/dust-trail", mode = "755" },
]

[dev-dependencies]
tempfile = "3"