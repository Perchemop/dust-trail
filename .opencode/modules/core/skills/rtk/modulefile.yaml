name: rtk
version: "0.1.0"
description: "CLI proxy; 60–90% token reduction on 100+ dev commands; single Rust binary, <10 ms overhead."
source: https://github.com/rtk-ai/rtk
licence: Apache-2.0
capability: CLI proxy that filters tool outputs to reduce token volume (~60-90% token reduction on dev commands)
installation: brew install rtk-ai/tap/rtk or cargo install --git https://github.com/rtk-ai/rtk (build output, not a toolchain run on client)
clean_room_compliant: true
cargo_free: true
reasoning: Reduces output token volume significantly; highly applicable to Dust Trail agent workflows